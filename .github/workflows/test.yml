name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/dooray-mail-bridge
      - name: Validate Compose and container image
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker build --build-arg VERSION="$GITHUB_SHA" -t dooray-mail-bridge:test .
          docker run --rm dooray-mail-bridge:test -version
