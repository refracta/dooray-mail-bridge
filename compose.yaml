services:
  bridge:
    image: dooray-mail-bridge:local
    build:
      context: .
      args:
        VERSION: ${BRIDGE_VERSION:-dev}
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      IMAP_ADDR: 0.0.0.0:1993
      SMTP_ADDR: 0.0.0.0:1465
      TLS_CERT: /certs/fullchain.pem
      TLS_KEY: /certs/privkey.pem
      ALLOW_INSECURE_LOCAL: "false"
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${IMAP_PORT:-1993}:1993"
      - "${BIND_ADDR:-127.0.0.1}:${SMTP_PORT:-1465}:1465"
    volumes:
      - data:/data
      - ${TLS_CERT_DIR:-./certs}:/certs:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  data:
